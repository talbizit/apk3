name: Build Android APK

on:
  push:
    branches: [ main, master, 'claude/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: icon-fitness-schedule
        path: app/build/outputs/apk/release/icon-fitness-schedule.apk

    - name: Create Release
      if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master') || startsWith(github.ref, 'refs/heads/claude/')
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Icon Fitness Schedule v1.0.${{ github.run_number }}
        body: |
          ## Icon Fitness Schedule - לוח שיעורים

          📱 אפליקציה להצגת לוח שיעורים של Icon Fitness
          ✅ Build ${{ github.run_number }}

          ### התקנה:
          1. הורד את קובץ ה-APK למטה
          2. העבר למכשיר האנדרואיד שלך
          3. אפשר התקנה ממקורות לא ידועים בהגדרות
          4. לחץ על קובץ ה-APK להתקנה

          ### תכונות:
          - 📅 לוח שיעורים שבועי
          - ⭐ מועדפים (מרובים)
          - 🔍 חיפוש לפי שיעור/מדריך
          - 📆 סינון לפי יום
          - 💾 מטמון 4 שעות
          - 🔄 רענון ברקע אוטומטי
          - 🌙 תמיכה במצב כהה
          - ➡️ ממשק בעברית (RTL)

          ### תאימות:
          Android 8.0+ (API 26)
        files: app/build/outputs/apk/release/icon-fitness-schedule.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
