name: Build Android APK

on:
  push:
    branches: [ main, master, 'claude/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create local.properties
      run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

    - name: Create debug keystore
      run: |
        mkdir -p ~/.android
        keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Build Release APK
      run: ./gradlew assembleRelease --no-daemon

    - name: Rename APK
      run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/icon-fitness-schedule.apk

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: icon-fitness-schedule-debug
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: icon-fitness-schedule-release
        path: app/build/outputs/apk/release/icon-fitness-schedule.apk
        retention-days: 30

    - name: Create Release
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Icon Fitness Schedule v1.0.${{ github.run_number }}
        body: |
          ## Icon Fitness Schedule App - לוח שיעורים

          אפליקציה להצגת לוח שיעורי הסטודיו ברשת Icon Fitness

          ### התקנה:
          1. הורד את קובץ ה-APK למטה
          2. התקן על מכשיר האנדרואיד שלך
          3. אם נדרש, אפשר התקנה ממקורות לא ידועים

          ### תכונות:
          - 📅 לוח שיעורים שבועי
          - ⭐ מועדפים (מרובים)
          - 🔍 חיפוש לפי שיעור/מדריך
          - 📆 סינון לפי יום
          - 💾 מטמון 4 שעות
          - 🔄 רענון ברקע אוטומטי
          - 🌙 תמיכה במצב כהה
          - ➡️ ממשק בעברית (RTL)

          ### תאימות:
          Android 8.0+ (API 26)
        files: app/build/outputs/apk/release/icon-fitness-schedule.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
